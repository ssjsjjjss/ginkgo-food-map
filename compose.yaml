services:
  frontend:
    build:
      context: ./frontend
      dockerfile: deploy/Dockerfile
    container_name: ginkgo-frontend
    restart: unless-stopped
    environment:
      BACKEND_HOST: host.docker.internal
      BACKEND_PORT: 8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"

  mysql:
    image: mysql:8.4
    container_name: ginkgo-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - ginkgo_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: ginkgo-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 192mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - ginkgo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ginkgo_mysql_data:
  ginkgo_redis_data:
